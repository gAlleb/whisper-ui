server {
    listen 80;
    server_name _;

    client_max_body_size 200m;          # большие аудиофайлы
    proxy_read_timeout 1800s;           # длинные записи считаются долго
    proxy_send_timeout 1800s;

    # статическая страница
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # проксируем распознавание на прокси-оркестратор
    location /process {
        proxy_pass http://proxy:8000/process;
        proxy_set_header Host $host;
    }

    # проксируем чат на прокси-оркестратор (ДОБАВЛЕНО)
    location /chat {
        proxy_pass http://proxy:8000/chat;
        proxy_set_header Host $host;
    }
}
